name: niki_cathay_kiosk
description: "Recreation of NIKI Cathay Photo Booth companion in Flutter for iOS and Android with offline local storage, camera capture, airplane slider, and TTS audio."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.6

  # Camera & Image Capture
  camera: ^0.10.5+9
  image: ^4.1.7

  # Offline Local Data Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Text-to-Speech (TTS)
  flutter_tts: ^3.8.5

  # Network & Backend Polling
  http: ^1.2.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
